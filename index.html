<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>教師成績查詢系統</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
  <style>
    body { font-family: "Microsoft JhengHei", sans-serif; padding: 25px; background-color: #f5f7f9; color: #333; }
    .container { max-width: 950px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h1 { text-align: center; color: #2c3e50; margin-bottom: 30px; }
    .section { border: 1px solid #e0e6ed; padding: 20px; margin-bottom: 25px; border-radius: 8px; position: relative; }
    h2 { margin-top: -35px; background: white; width: fit-content; padding: 0 10px; color: #3498db; font-size: 1.1rem; }
    input[type="number"], input[type="file"], input[type="text"], input[type="password"], select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    input[type="number"] { width: 70px; margin-right: 10px; }
    input[type="text"], input[type="password"] { width: 100%; box-sizing: border-box; }
    select { width: 200px; margin-left: 10px; cursor: pointer; }
    button { padding: 10px 15px; cursor: pointer; border: none; border-radius: 5px; transition: 0.3s; font-weight: bold; }
    .btn-blue { background-color: #3498db; color: white; }
    .btn-green { background-color: #27ae60; color: white; font-size: 1rem; }
    .btn-red { background-color: #e74c3c; color: white; }
    .btn-orange { background-color: #f39c12; color: white; }
    .btn-purple { background-color: #9b59b6; color: white; width: 100%; font-size: 1.1rem; margin-top: 15px; }
    .row { margin: 15px 0; }
    #progressContainer { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.85); z-index: 2000; flex-direction: column; justify-content: center; align-items: center; }
    .hourglass { display: inline-block; position: relative; width: 64px; height: 64px; }
    .hourglass:after { content: " "; display: block; border-radius: 50%; width: 0; height: 0; margin: 8px; box-sizing: border-box; border: 26px solid #3498db; border-color: #3498db transparent #3498db transparent; animation: hourglass 1.2s infinite; }
    @keyframes hourglass { 0% { transform: rotate(0); animation-timing-function: cubic-bezier(0.55, 0.055, 0.675, 0.19); } 50% { transform: rotate(900deg); animation-timing-function: cubic-bezier(0.215, 0.61, 0.355, 1); } 100% { transform: rotate(1800deg); } }
    #progressBar { margin-top: 15px; color: #3498db; font-weight: bold; font-size: 1.1rem; letter-spacing: 1px; }
    .data-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.95rem; }
    .data-table th, .data-table td { border: 1px solid #ddd; padding: 10px; text-align: center; }
    .data-table th { background-color: #f8f9fa; }
    #alertOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 999; }
    #alertBox { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 30px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); z-index: 1000; text-align: center; min-width: 280px; }
  </style>
</head>
<body>

<div class="container">
  <h1 id="mainTitle">教師成績查詢系統</h1>
  <div id="alertOverlay"></div>
  <div id="alertBox"><div id="alertMsg"></div><button class="btn-blue" onclick="closeAlert()">確定</button></div>
  <div id="progressContainer"><div class="hourglass"></div><div id="progressBar">系統處理中...</div></div>

  <div id="teacherDashboard" class="section" style="display: none; border: 2px solid #27ae60; background-color: #fafffa;">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #27ae60; margin-bottom: 15px; padding-bottom: 5px;">
      <h2 id="dashboardTitle" style="color: #27ae60; background: #fafffa; margin: 0; border: none;">📊 教師成績自主查詢看板</h2>
      <button class="btn-red" style="padding: 6px 15px; font-size: 0.9rem; margin-top: -10px;" onclick="handleLogout()">登出系統</button>
    </div>

    <div class="row" style="background: #eef9ee; padding: 12px; border-radius: 6px; font-weight: bold; margin-bottom: 20px;">
      歡迎回來，<span id="userWelcomeName" style="color: #27ae60; font-size: 1.2rem;">老師</span>！
      您的登入權限為：<span id="userWelcomeRole" style="color: #f39c12;">讀取中</span>
    </div>
    
    <div id="queryControlRow" class="row" style="display: flex; gap: 15px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; border-bottom: 1px dashed #ccc; padding-bottom: 15px;">
      <div>
        <span style="font-weight:bold;">選擇查詢學期：</span>
        <select id="viewYear" style="width: 120px;"></select>
        <select id="viewSemester" style="width: 100px;"><option value="1">第1學期</option><option value="2">第2學期</option></select>
      </div>
      <div>
        <span style="font-weight:bold;">選擇考試：</span>
        <select id="viewExamType" style="width: 160px;">
          <option value="第一次定期考">第一次定期考</option>
          <option value="第二次定期考">第二次定期考</option>
          <option value="第三次定期考">第三次定期考</option>
          <option value="週考自然">週考自然</option>
          <option value="週考英語">週考英語</option>
          <option value="週考數學">週考數學</option>
          <option value="週考體育">週考體育</option>
        </select>
      </div>
      <button class="btn-blue" onclick="loadScoreData()">🔍 查詢</button>
    </div>

    <div id="mainContentArea">
      <p style="color:#666;">請選擇學期與考試後按查詢...</p>
    </div>
  </div>
</div>

<script>
// =====================================================================
  const urlParams = new URLSearchParams(window.location.search);
  const ssoToken = urlParams.get('token') || "";
  const CURRENT_APP_URL = "https://cjh123-coder.github.io/score/";
  const SSO_CENTER_URL = "https://cjh123-coder.github.io/sso/"; 
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbw4Zcvkvre7AZNVJ2qGCzhme9Ra36P4u6a3SMCtmH2e1AJm9oOBC7Pv8rDvM-y17EAu/exec"; 

  const google = {
    script: {
      run: new Proxy({}, {
        get: function(target, prop) {
          if (prop === 'withSuccessHandler') {
            return function(callback) { target._onSuccess = callback; return new Proxy(target, this); }.bind(this);
          }
          if (prop === 'withFailureHandler') {
            return function(callback) { target._onFailure = callback; return new Proxy(target, this); }.bind(this);
          }
          return function(...args) {
            const payload = { method: prop, args: args };
            const successCb = target._onSuccess;
            const failureCb = target._onFailure;
            target._onSuccess = null; target._onFailure = null;
            const sessionId = localStorage.getItem('sysSessionId') || "";
            const securePayload = { ...payload, sessionId: sessionId };
            fetch(GAS_API_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify(securePayload)
            })
            .then(res => res.json())
            .then(result => {
              if(result.status === 'success' && successCb) successCb(result.data);
              else if(result.status === 'error' && failureCb) failureCb(result.message);
            })
            .catch(err => { console.error(err); if(failureCb) failureCb(err.toString()); });
          };
        }
      })
    }
  };

  function getCurrentAcademicTerm() {
    const now = new Date();
    const year = now.getFullYear() - 1911;
    const month = now.getMonth() + 1;
    const semester = (month >= 8 || month <= 1) ? "1" : "2";
    return { year: year.toString(), semester: semester };
  }

  function showTerminalScreen(title, message, showLoginBtn) {
    const btnHtml = showLoginBtn ? `<br><br><a href="${SSO_CENTER_URL}?redirect=${encodeURIComponent(CURRENT_APP_URL)}" style="display:inline-block; padding:12px 24px; background-color:#3498db; color:white; text-decoration:none; border-radius:6px;">重新登入</a>` : '';
    document.body.innerHTML = `
      <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; font-family:sans-serif; background:#f4f6f9; text-align:center;">
        <h2 style="color:#2c3e50;">${title}</h2>
        <p style="color:#555; font-size:1.1rem; line-height:1.6; max-width:500px;">${message}</p>
        ${btnHtml}
      </div>
    `;
  }

  function closeAlert(){ document.getElementById('alertOverlay').style.display='none'; document.getElementById('alertBox').style.display='none'; }
  function showAlert(msg){ document.getElementById('alertMsg').innerHTML=msg; document.getElementById('alertOverlay').style.display='block'; document.getElementById('alertBox').style.display='block'; }

  // ✅ 修正1：初始化 UI，解決 undefined
  function initDashboardUI() {
    const raw = localStorage.getItem('sysUserData');
    if (!raw) return false;
    try {
      const user = JSON.parse(raw);
      console.log("使用者資料:", user);
      const dashboard = document.getElementById('teacherDashboard');
      if (dashboard) dashboard.style.display = 'block';
      const nameEl = document.getElementById('userWelcomeName');
      const roleEl = document.getElementById('userWelcomeRole');
      const displayName = user.displayName || user.name || user.teacherName || user.email || "老師";
      const roleName = user.role || user.roleId || "teacher";
      if (nameEl) nameEl.textContent = displayName;
      if (roleEl) roleEl.textContent = roleName;
      return true;
    } catch(e) { console.error(e); return false; }
  }

  // ✅ 修正2：初始化學年選單，解決你截圖中空白的問題
  function initYearOptions() {
    const yearSel = document.getElementById('viewYear');
    if (!yearSel) return;
    if (yearSel.options.length > 0) return; // 避免重複
    const current = getCurrentAcademicTerm();
    const savedYear = localStorage.getItem('sysYear') || current.year;
    const savedSem = localStorage.getItem('sysSemester') || current.semester;
    const savedExam = localStorage.getItem('sysExamType') || "第一次定期考";

    for (let y = 108; y <= 115; y++) {
      const opt = document.createElement('option');
      opt.value = y.toString();
      opt.textContent = y + "學年度";
      yearSel.appendChild(opt);
    }
    yearSel.value = savedYear;
    document.getElementById('viewSemester').value = savedSem;
    document.getElementById('viewExamType').value = savedExam;
  }

  // ✅ 修正3：真正載入成績的函式
  function loadScoreData() {
    const year = document.getElementById('viewYear').value;
    const semester = document.getElementById('viewSemester').value;
    const examType = document.getElementById('viewExamType').value;
    
    if(!year){ showAlert("請選擇學年度"); return; }

    localStorage.setItem('sysYear', year);
    localStorage.setItem('sysSemester', semester);
    localStorage.setItem('sysExamType', examType);

    const contentArea = document.getElementById('mainContentArea');
    contentArea.innerHTML = `<p style="color:#3498db;">🔄 正在載入 ${year}學年度第${semester}學期 ${examType}...</p>`;
    document.getElementById('progressContainer').style.display = 'flex';

    // 呼叫後端：先拿原始資料，再產生報表 (依你原本的邏輯)
    // 如果你的後端有 compiled_reports 快取，可以直接呼叫 generateLiveReportHtml
    google.script.run
      .withSuccessHandler(function(result){
        document.getElementById('progressContainer').style.display = 'none';
        console.log("報表結果:", result);
        if(result && result.success !== false) {
          // 可能是 {html: "..."} 或直接是字串
          const html = result.html || result;
          if(html && html.length > 10){
            contentArea.innerHTML = html;
          } else {
            contentArea.innerHTML = `<p style="color:#e67e22;">⚠️ ${year}學年度第${semester}學期 ${examType} 目前沒有編譯好的報表。<br>請確認試算表內有資料，或請管理員執行【編譯權限】與【批次儲存】。</p>`;
          }
        } else {
          contentArea.innerHTML = `<p style="color:#e74c3c;">載入失敗：${result.message || '未知錯誤'}</p>`;
        }
      })
      .withFailureHandler(function(err){
        document.getElementById('progressContainer').style.display = 'none';
        console.error(err);
        contentArea.innerHTML = `<p style="color:#e74c3c;">❌ 伺服器連線異常：${err}<br><br>請按 F12 開啟 Console，看是否有 CORS 或 Session 錯誤。<br>常見原因：GAS 沒有重新部署新版本，或 Firebase 密鑰錯誤。</p>`;
      })
      .generateLiveReportHtml(year, semester, examType, "ALL_DASHBOARD", null);
  }

  function checkSSOStatus() {
    const localUserRaw = localStorage.getItem('sysUserData');
    if (localUserRaw) {
      const lastActive = localStorage.getItem('sysLastActive');
      if (lastActive && (Date.now() - parseInt(lastActive, 10) > 5 * 60 * 1000)) {
        localStorage.clear();
        showTerminalScreen("⏳ 閒置逾時，已自動登出", "您已離線閒置超過 5 分鐘，系統已將您登出。", true);
        return;
      }
      console.log("SSO 狀態：已登入");
      initYearOptions();
      initDashboardUI();
      // 自動載入一次
      setTimeout(loadScoreData, 300);
      return; 
    }

    if (ssoToken) {
      document.body.innerHTML = `
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; background-color: #f4f6f9;">
          <h2 style="color: #1a73e8;">🔄 豐東國中 SSO 身分驗證中...</h2>
          <p style="color: #555;">正在安全載入您的專屬學情資料，請稍候</p>
        </div>
      `;
      const currentTerm = getCurrentAcademicTerm();
      google.script.run
        .withSuccessHandler(function(res) {
          if (res.success) {
            let userData = res.userData;
            if (!userData.displayName) userData.displayName = userData.name || userData.email || "老師";
            localStorage.setItem('sysUserData', JSON.stringify(userData));
            if (res.sessionId) localStorage.setItem('sysSessionId', res.sessionId);
            localStorage.setItem('sysYear', currentTerm.year);
            localStorage.setItem('sysSemester', currentTerm.semester);
            localStorage.setItem('sysLastActive', Date.now().toString());
            window.location.replace(CURRENT_APP_URL);
          } else {
            alert("SSO 驗證失敗：" + res.message);
            window.location.replace(SSO_CENTER_URL + "?redirect=" + encodeURIComponent(CURRENT_APP_URL));
          }
        })
        .withFailureHandler(function(err) {
          alert("伺服器連線異常：" + err);
        })
        .verifySSOLogin(currentTerm.year, currentTerm.semester, ssoToken);
    } else {
      window.location.replace(SSO_CENTER_URL + "?redirect=" + encodeURIComponent(CURRENT_APP_URL));
    }
  }

  function handleLogout() {
    const sessionId = localStorage.getItem('sysSessionId') || "";
    google.script.run.withSuccessHandler(function(){
      localStorage.clear();
      window.location.replace(SSO_CENTER_URL + "?redirect=" + encodeURIComponent(CURRENT_APP_URL) + "&_logout=1");
    }).withFailureHandler(function(){
      localStorage.clear();
      window.location.replace(SSO_CENTER_URL + "?redirect=" + encodeURIComponent(CURRENT_APP_URL));
    }).logoutSession();
  }

  document.addEventListener("DOMContentLoaded", function() {
    checkSSOStatus();
  });

  let idleTimer;
  const IDLE_TIMEOUT_MS = 5 * 60 * 1000; 
  function resetIdleTimer() {
    if (!localStorage.getItem('sysUserData')) return;
    localStorage.setItem('sysLastActive', Date.now().toString());
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      localStorage.clear();
      showTerminalScreen("⏳ 閒置逾時，已自動登出", "您已閒置超過 5 分鐘，系統基於安全考量已將您登出。", true);
    }, IDLE_TIMEOUT_MS);
  }
  ['mousemove', 'keydown', 'scroll', 'click', 'touchstart'].forEach(event => {
    document.addEventListener(event, resetIdleTimer);
  });
</script>
</body>
</html>
